# 超级学习系统 - 生产部署编排
# 用法：docker compose up -d --build
services:
  superstudy:
    build: .
    container_name: superstudy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 学习数据（用户/项目/素材/快照/会话）持久化到宿主机
      - superstudy_data:/app/data
    environment:
      - LEARN_HOST=0.0.0.0
      - LEARN_PORT=8080
      # 服务器出网代理（若需要；留空则直连）
      - LEARN_HTTP_PROXY=
      - LEARN_HTTPS_PROXY=

volumes:
  superstudy_data:
